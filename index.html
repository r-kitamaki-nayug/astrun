  <!-- UNITY_WEBGL_TEMPLATE -->
  
  <!--
  ■iframe通信の仕組み
  
  1. iframe内のゲームが featureAccountGet() でリクエスト作成
  2. window.parent.postMessage() で親ウィンドウ（プラットフォーム側）に送信
  3. 親ウィンドウがサーバー通信を行い、レスポンスを作成
  4. 親ウィンドウから iframe.contentWindow.postMessage() でゲームにレスポンス送信 
  -->
  
  <!DOCTYPE html>
  <html lang="en">
<head>
  <meta charset="utf-8">
  <title>GamePlatform WebGL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <canvas id="unity-canvas"></canvas>
  <script src="Build/astrun.loader.js"></script>

  <script>
    var unityInstance = null;
    createUnityInstance(document.querySelector("#unity-canvas"), {
      dataUrl: "Build/astrun.data",
      frameworkUrl: "Build/astrun.framework.js",
      codeUrl: "Build/astrun.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "YourCompany",
      productName: "YourGame",
      productVersion: "1.0",
    }).then((instance) => {
      unityInstance = instance;
      console.log("[HTML] Unity instance created successfully");
    }).catch((error) => {
      console.error("[HTML] Unity instance creation failed:", error);
    });
  </script>
  <script type="module">
    import * as TG from "./tbs-game.js";

    console.log("[HTML] TG module loaded:", TG);

    // サーバー通信フラグ
    let useRealServer = true; // trueにすると実際のサーバー通信

    // アカウント情報取得
    window.TG_featureAccountGet = () => {
      console.log("[HTML] TG_featureAccountGet called");
      
      if (useRealServer) {
        const request = TG.featureAccountGet();
        console.log("[HTML] Account request:", request);
        
        // iframe内から親ウィンドウにメッセージを送信
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(request, "*");
        } else {
          window.postMessage(request, "*");
        }
      }
    };

    // サインイン（手動実行のみ）
    window.TG_featureAccountSignIn = () => {
      console.log("[HTML] TG_featureAccountSignIn called");
      const request = TG.featureAccountSignIn();
      console.log("[HTML] SignIn request:", request);
      
      // iframe内から親ウィンドウにメッセージを送信
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(request, "*");
      } else {
        window.postMessage(request, "*");
      }
    };

    // ランキング関連（必要に応じて）
    window.TG_featureRankingGetList = () => {
      const request = TG.featureRankingGetList({
        category: "total",
        limit: 10,
        offset: 0,
      });
      
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(request, "*");
      } else {
        window.postMessage(request, "*");
      }
    };

    window.TG_featureRankingGetMy = () => {
      const request = TG.featureRankingGetMy();
      
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(request, "*");
      } else {
        window.postMessage(request, "*");
      }
    };

    window.TG_featureRankingPost = (score) => {
      const request = TG.featureRankingPost({ score: Number(score) });
      
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(request, "*");
      } else {
        window.postMessage(request, "*");
      }
    };

    // メッセージ受信処理
    window.addEventListener("message", (e) => {
      console.log("[HTML] サーバーからのレスポンス:", e.data);
      
      const d = e.data;
      if (d && d.type === TG.Type.Event) {
        switch (d.data.command) {
          case TG.EventType.State.Ready: {
            console.log("[HTML] プラットフォーム準備完了");
            // 準備完了時は何もしない（Unity側で必要に応じてアカウント取得）
            return;
          }
          case TG.EventType.State.NotReady: {
            console.log("[HTML] プラットフォーム未準備 - サインインが必要");
            // 自動サインインは実行しない（手動実行のみ）
            return;
          }
          case TG.EventType.Account.Get: {
            const value = d.data.value;
            if (value && value.result) {
              console.log("[HTML] アカウント取得成功:", value.display_name);
              
              // Unityにアカウントデータを送信
              if (unityInstance) {
                const jsonResponse = JSON.stringify(d);
                unityInstance.SendMessage("GamePlatform", "OnMessageFromPlatform", jsonResponse);
              }
            } else {
              console.log("[HTML] アカウント取得失敗");
            }
            return;
          }
        }
      }
      
      // その他のメッセージはUnityに転送
      if (unityInstance && e.data) {
        const json = JSON.stringify(e.data);
        unityInstance.SendMessage("GamePlatform", "OnMessageFromPlatform", json);
      }
    });

    // エラーハンドリング
    window.addEventListener("error", (e) => {
      console.error("[HTML] JavaScript error:", e.error);
    });

    // 初期化
    window.addEventListener("load", () => {
      console.log("[HTML] Page loaded, iframe通信準備完了");
      console.log("[HTML] 親ウィンドウ存在:", window.parent !== window);
      
      // Unity側で必要に応じてアカウント取得を実行するため、
      // ここでは自動実行しない
    });
  </script>
</body>
</html>
