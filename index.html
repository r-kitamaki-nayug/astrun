<!-- UNITY_WEBGL_TEMPLATE -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GamePlatform WebGL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <canvas id="unity-canvas"></canvas>
  <script src="Build/astrun.loader.js"></script>


  <script>
    var unityInstance = null;
    createUnityInstance(document.querySelector("#unity-canvas"), {
      dataUrl: "Build/astrun.data",
      frameworkUrl: "Build/astrun.framework.js",
      codeUrl: "Build/astrun.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "YourCompany",
      productName: "YourGame",
      productVersion: "1.0",
    }).then((instance) => {
      unityInstance = instance;
    });
  </script>

  <script type="module">
    import * as TG from "./tbs-game.js";

    window.TG_featureAccountGet = () => {
      window.postMessage(TG.featureAccountGet(), "*");
    };
    window.TG_featureAccountSignIn = () => {
      window.postMessage(TG.featureAccountSignIn(), "*");
    };
    window.TG_featureRankingGetList = () => {
      window.postMessage(TG.featureRankingGetList({
        category: "total",
        limit: 10,
        offset: 0,
      }), "*");
    };
    window.TG_featureRankingGetMy = () => {
      window.postMessage(TG.featureRankingGetMy(), "*");
    };
    window.TG_featureRankingPost = (score) => {
      window.postMessage(TG.featureRankingPost({ score: Number(score) }), "*");
    };

    window.addEventListener("message", (e) => {
      const json = JSON.stringify(e.data);
      if (unityInstance) {
        unityInstance.SendMessage("GamePlatform", "OnMessageFromPlatform", json);
      } else {
        console.warn("Unity instance not ready yet");
      }
    });
  </script>
</body>
</html>
