  <!-- UNITY_WEBGL_TEMPLATE -->
  
  <!--
  ■iframe通信の仕組み
  
  1. iframe内のゲームが featureAccountGet() でリクエスト作成
  2. window.parent.postMessage() で親ウィンドウ（プラットフォーム側）に送信
  3. 親ウィンドウがサーバー通信を行い、レスポンスを作成
  4. 親ウィンドウから iframe.contentWindow.postMessage() でゲームにレスポンス送信 
  -->
  
  <!DOCTYPE html>
  <html lang="en">
<head>
  <meta charset="utf-8">
  <title>GamePlatform WebGL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <canvas id="unity-canvas"></canvas>
  <script src="Build/astrun.loader.js"></script>

  <script>
    var unityInstance = null;
    createUnityInstance(document.querySelector("#unity-canvas"), {
      dataUrl: "Build/astrun.data",
      frameworkUrl: "Build/astrun.framework.js",
      codeUrl: "Build/astrun.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "YourCompany",
      productName: "YourGame",
      productVersion: "1.0",
    }).then((instance) => {
      unityInstance = instance;
      console.log("[HTML] Unity instance created successfully");
    }).catch((error) => {
      console.error("[HTML] Unity instance creation failed:", error);
    });
  </script>
  <script type="module">
    import * as TG from "./tbs-game.js";

    console.log("[HTML] TG module loaded:", TG);

    // サーバー通信フラグ
    let useRealServer = true; // trueにすると実際のサーバー通信、falseでローカルモック
    
    // ローカルテスト用モックデータ
    const mockUserData = {
      uid: "local_test_user_123",
      display_name: "テストユーザー（ローカル）",
      result: true
    };
    
    // モックレスポンス生成
    function createMockResponse(command, success = true, data = null) {
      return {
        id: Date.now(),
        type: TG.Type.Event,
        data: {
          command: command,
          result: success,
          value: data || mockUserData
        }
      };
    }

    // アカウント情報取得
    window.TG_featureAccountGet = () => {
      console.log("[HTML] TG_featureAccountGet called");
      console.log("[HTML] Mode:", useRealServer ? "Real Server" : "Local Mock");
      
      if (useRealServer) {
        const request = TG.featureAccountGet();
        console.log("[HTML] Account request:", request);
        
        // iframe内から親ウィンドウにメッセージを送信
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(request, "*");
        } else {
          window.postMessage(request, "*");
        }
      } else {
        // ローカルモック: アカウント取得成功をシミュレート
        console.log("[HTML] [MOCK] アカウント取得をシミュレート");
        setTimeout(() => {
          const mockResponse = createMockResponse(TG.EventType.Account.Get, true, mockUserData);
          console.log("[HTML] [MOCK] アカウント取得成功:", mockResponse);
          window.dispatchEvent(new MessageEvent('message', { data: mockResponse }));
        }, 500); // 0.5秒後にレスポンス
      }
    };

    // サインイン（手動実行のみ）
    window.TG_featureAccountSignIn = () => {
      console.log("[HTML] TG_featureAccountSignIn called");
      console.log("[HTML] Mode:", useRealServer ? "Real Server" : "Local Mock");
      
      if (useRealServer) {
        const request = TG.featureAccountSignIn();
        console.log("[HTML] SignIn request:", request);
        
        // iframe内から親ウィンドウにメッセージを送信
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(request, "*");
        } else {
          window.postMessage(request, "*");
        }
      } else {
        // ローカルモック: サインイン成功をシミュレート
        console.log("[HTML] [MOCK] サインインをシミュレート");
        setTimeout(() => {
          const readyResponse = createMockResponse(TG.EventType.State.Ready, true);
          console.log("[HTML] [MOCK] サインイン成功 - State.Ready:", readyResponse);
          window.dispatchEvent(new MessageEvent('message', { data: readyResponse }));
        }, 1000); // 1秒後にState.Ready
      }
    };

    // ランキング関連（必要に応じて）
    window.TG_featureRankingGetList = () => {
      const request = TG.featureRankingGetList({
        category: "total",
        limit: 10,
        offset: 0,
      });
      
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(request, "*");
      } else {
        window.postMessage(request, "*");
      }
    };

    window.TG_featureRankingGetMy = () => {
      console.log("[HTML] TG_featureRankingGetMy called");
      console.log("[HTML] Mode:", useRealServer ? "Real Server" : "Local Mock");
      
      if (useRealServer) {
        const request = TG.featureRankingGetMy();
        console.log("[HTML] My ranking request:", request);
        
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(request, "*");
        } else {
          window.postMessage(request, "*");
        }
      } else {
        // ローカルモック: 自分のハイスコアをシミュレート
        console.log("[HTML] [MOCK] 自分のハイスコア取得をシミュレート");
        setTimeout(() => {
          const mockHighScore = Math.floor(Math.random() * 3000) + 1000; // 10.00～40.00秒相当
          const mockResponse = createMockResponse(TG.EventType.Ranking.GetMy, true, {
            uid: mockUserData.uid,
            display_name: mockUserData.display_name,
            score: mockHighScore,
            rank: Math.floor(Math.random() * 50) + 1,
            updated_at: new Date().toISOString()
          });
          console.log("[HTML] [MOCK] 自分のハイスコア:", mockHighScore, "（", (mockHighScore/100).toFixed(2), "秒相当）");
          window.dispatchEvent(new MessageEvent('message', { data: mockResponse }));
        }, 400); // 0.4秒後にレスポンス
      }
    };

    window.TG_featureRankingPost = (score) => {
      console.log("[HTML] TG_featureRankingPost called with score:", score);
      console.log("[HTML] Mode:", useRealServer ? "Real Server" : "Local Mock");
      
      if (useRealServer) {
        const request = TG.featureRankingPost({ score: Number(score) });
        console.log("[HTML] Ranking post request:", request);
        
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(request, "*");
        } else {
          window.postMessage(request, "*");
        }
      } else {
        // ローカルモック: スコア送信成功をシミュレート
        console.log("[HTML] [MOCK] スコア送信をシミュレート - スコア:", score);
        setTimeout(() => {
          const mockResponse = createMockResponse(TG.EventType.Ranking.Post, true, {
            score: Number(score),
            rank: Math.floor(Math.random() * 10) + 1, // ランダムな順位
            submitted_at: new Date().toISOString()
          });
          console.log("[HTML] [MOCK] スコア送信成功:", mockResponse);
          window.dispatchEvent(new MessageEvent('message', { data: mockResponse }));
        }, 300); // 0.3秒後にレスポンス
      }
    };

    // メッセージ受信処理（ログインフロー対応版）
    window.addEventListener("message", (e) => {
      console.log("[HTML] サーバーからのレスポンス:", e.data);
      
      const d = e.data;
      if (d && d.type === TG.Type.Event) {
        switch (d.data.command) {
          case TG.EventType.State.Ready: {
            console.log("[HTML] プラットフォーム準備完了");
            // State.Readyの場合、ログイン処理後なのでユーザー情報を再取得
            if (!isLoggedIn) {
              console.log("[HTML] ログイン完了後、ユーザー情報を再取得");
              retryGetUserInfo();
            }
            return;
          }
          case TG.EventType.State.NotReady: {
            console.log("[HTML] プラットフォーム未準備 - ログインが必要");
            if (!isLoggedIn) {
              // 未ログイン状態なのでログインを実行
              performLogin();
            }
            return;
          }
          case TG.EventType.Account.Get: {
            const value = d.data.value;
            if (value && value.result && value.display_name) {
              // ユーザー情報取得成功
              console.log("[HTML] ✓ ログイン成功:", value.display_name);
              isLoggedIn = true;
              userInfo = value;
              
              // Unityにログイン成功を通知
              notifyUnityLoginStatus(true, value);
              
              // 元のフォーマットでもUnityに送信（既存の処理との互換性）
              if (unityInstance) {
                const jsonResponse = JSON.stringify(d);
                unityInstance.SendMessage("GamePlatform", "OnMessageFromPlatform", jsonResponse);
              }
            } else {
              // ユーザー情報取得失敗
              console.log("[HTML] ✗ ユーザー情報取得失敗 - ログインが必要");
              if (!isLoggedIn) {
                performLogin();
              } else {
                // ログインしたはずなのに失敗した場合
                console.error("[HTML] ログイン後もユーザー情報取得に失敗");
                isLoggedIn = false;
                userInfo = null;
                notifyUnityLoginStatus(false);
              }
            }
            return;
          }
          case TG.EventType.Ranking.Post: {
            const value = d.data.value;
            console.log("[HTML] ランキング投稿結果:", value);
            
            // Unityにスコア投稿結果を通知
            if (unityInstance) {
              const jsonResponse = JSON.stringify(d);
              console.log("[HTML] Unityにスコア投稿結果を送信:", jsonResponse);
              unityInstance.SendMessage("GamePlatform", "OnScoreSubmitted", jsonResponse);
            }
            return;
          }
          case TG.EventType.Ranking.GetMy: {
            const value = d.data.value;
            console.log("[HTML] 自分のハイスコア取得結果:", value);
            
            // Unityにハイスコア取得結果を通知
            if (unityInstance) {
              const jsonResponse = JSON.stringify(d);
              console.log("[HTML] Unityにハイスコア取得結果を送信:", jsonResponse);
              unityInstance.SendMessage("GamePlatform", "OnHighScoreReceived", jsonResponse);
            }
            return;
          }
        }
      }
      
      // その他のメッセージはUnityに転送
      if (unityInstance && e.data) {
        const json = JSON.stringify(e.data);
        unityInstance.SendMessage("GamePlatform", "OnMessageFromPlatform", json);
      }
    });

    // エラーハンドリング
    window.addEventListener("error", (e) => {
      console.error("[HTML] JavaScript error:", e.error);
    });

    // 環境検出（ローカル環境の場合は自動でモックモードに）
    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === '') {
      useRealServer = false;
      console.log("[HTML] === ローカル環境検出 - モックモードに自動切り替え ===");
    } else {
      console.log("[HTML] === 本番環境検出 - 実サーバーモード ===");
    }
    
    // ログイン状態管理
    let isLoggedIn = false;
    let userInfo = null;
    
    // 初期化とログインフロー開始
    window.addEventListener("load", () => {
      console.log("[HTML] Page loaded, iframe通信準備完了");
      console.log("[HTML] 動作モード:", useRealServer ? "実サーバー" : "ローカルモック");
      console.log("[HTML] 親ウィンドウ存在:", window.parent !== window);
      console.log("[HTML] 現在のURL:", window.location.href);
      
      // ページ読み込み後、自動でログインフローを開始
      setTimeout(() => {
        console.log("[HTML] === ログインフロー開始 ===");
        if (!useRealServer) {
          console.log("[HTML] [MOCK] モックモードでログインフローを開始");
        }
        initiateLoginFlow();
        
        // ローカルモックの場合、2秒後にハイスコア取得もトリガー
        if (!useRealServer) {
          setTimeout(() => {
            console.log("[HTML] [MOCK] ハイスコア取得を自動実行");
            window.TG_featureRankingGetMy();
          }, 2000);
        }
      }, 1000); // Unity初期化を待つ
    });
    
    // ログインフローの実行
    function initiateLoginFlow() {
      console.log("[HTML] Step 1: ユーザー情報を取得中...");
      
      // まずユーザー情報を取得してみる
      if (window.TG_featureAccountGet) {
        window.TG_featureAccountGet();
      } else {
        console.error("[HTML] TG_featureAccountGet not available");
      }
    }
    
    // ログインが必要な場合の処理
    function performLogin() {
      console.log("[HTML] Step 2: ログインを実行中...");
      
      if (window.TG_featureAccountSignIn) {
        window.TG_featureAccountSignIn();
      } else {
        console.error("[HTML] TG_featureAccountSignIn not available");
      }
    }
    
    // ログイン後の再取得
    function retryGetUserInfo() {
      console.log("[HTML] Step 3: ログイン後にユーザー情報を再取得中...");
      
      if (window.TG_featureAccountGet) {
        window.TG_featureAccountGet();
      }
    }
    
    // Unityにログイン状態を通知
    function notifyUnityLoginStatus(loggedIn, userData = null) {
      if (unityInstance) {
        const loginStatus = {
          isLoggedIn: loggedIn,
          userData: userData
        };
        
        console.log("[HTML] Unityにログイン状態を通知:", loginStatus);
        unityInstance.SendMessage("GamePlatform", "OnLoginStatusChanged", JSON.stringify(loginStatus));
      }
    }
  </script>
</body>
</html>
